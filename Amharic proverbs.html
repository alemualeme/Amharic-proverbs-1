<!DOCTYPE html>
<html lang="am">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>የአማርኛ አባባሎች እና ቀልዶች ማከማቻ</title>
    <!-- Telegram Web App SDK -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>
    
    <!-- Firebase SDK (v9 Modular CDN) -->
    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, set, onValue, update, remove } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCgPRdCOpgzuhUntQTxu9Fv_oKKgDMfLcw",
            authDomain: "amharicproverbb.firebaseapp.com",
            databaseURL: "https://amharicproverbb-default-rtdb.firebaseio.com/",
            projectId: "amharicproverbb",
            storageBucket: "amharicproverbb.firebasestorage.app",
            messagingSenderId: "203662190638",
            appId: "1:203662190638:web:825fa9e0596a4e48de57bf"
        };

        const ADMIN_CHAT_ID = "8294878463"; 

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const tg = window.Telegram.WebApp;
        tg.expand();
        
        // Theme Management: 0 = Light, 1 = Dark, 2 = Soft Bright (Eye Comfort)
        let currentThemeMode = 0;

        window.toggleTheme = function() {
            currentThemeMode = (currentThemeMode + 1) % 3;
            applyTheme(currentThemeMode);
        };

        function applyTheme(mode) {
            const root = document.documentElement;
            const btn = document.getElementById('themeToggleBtn');

            if (mode === 1) {
                // Dark Mode
                root.style.setProperty('--bg-color', '#18222d');
                root.style.setProperty('--card-bg', '#232e3c');
                root.style.setProperty('--text-color', '#ffffff');
                root.style.setProperty('--sub-text', '#a8b2bc');
                root.style.setProperty('--input-bg', '#131c25');
                root.style.setProperty('--border-color', '#2f3b4c');
                btn.innerText = '🌙 ጨለማ';
            } else if (mode === 2) {
                // Soft Bright / Eye Comfort (ቦዝዝ ያለ Warm Cream)
                root.style.setProperty('--bg-color', '#f7f4ec');
                root.style.setProperty('--card-bg', '#fffdf9');
                root.style.setProperty('--text-color', '#2c2a29');
                root.style.setProperty('--sub-text', '#8c857b');
                root.style.setProperty('--input-bg', '#ffffff');
                root.style.setProperty('--border-color', '#e3decb');
                btn.innerText = '👁️ Soft Bright';
            } else {
                // Normal Bright (Light)
                root.style.setProperty('--bg-color', '#f1f2f6');
                root.style.setProperty('--card-bg', '#ffffff');
                root.style.setProperty('--text-color', '#222222');
                root.style.setProperty('--sub-text', '#777777');
                root.style.setProperty('--input-bg', '#ffffff');
                root.style.setProperty('--border-color', '#e0e0e0');
                btn.innerText = '☀️ ብርሃናዊ';
            }
        }

        let currentUser = { id: "unknown", name: "እንግዳ ተጠቃሚ" };
        if (tg.initDataUnsafe && tg.initDataUnsafe.user) {
            currentUser.id = tg.initDataUnsafe.user.id;
            currentUser.name = `${tg.initDataUnsafe.user.first_name || ''} ${tg.initDataUnsafe.user.last_name || ''}`.trim() || "ተጠቃሚ";
        } else {
            currentUser.id = "web_user_" + Math.floor(Math.random() * 1000);
            currentUser.name = "የዌብ ተጠቃሚ";
        }

        const sampleData = [
            { id: "s1", type: "ምሳሌያዊ አነጋገር", text: "የቆጡን አወርድ ብላ የብብቷን ጣለች።", meaning: "ትልቅ ጥቅም ለማግኘት ስትል በእጅ ያለውን ትንሽ ነገር በስግብግብነት ማጣት።", userName: "አድሚን", timestamp: 1 },
            { id: "s2", type: "ምሳሌያዊ አነጋገር", text: "ካለፈው ድስት የፈላው ይበልጣል።", meaning: "ያለፈውን አሉታዊ ነገር ትቶ ለወደፊቱ የተሻለ ተስፋ ማድረግ።", userName: "አድሚን", timestamp: 2 },
            { id: "s3", type: "ምሳሌያዊ አነጋገር", text: "ድር ቢያብር አንበሳ ያስር።", meaning: "ኅብረት እና አንድነት ትልቅና አስቸጋሪ ነገሮችን ለመስራት ያስችላል።", userName: "አድሚን", timestamp: 3 },
            { id: "s4", type: "አባባል", text: "ዕውቀት የብርሃን ቁልፍ ነው።", meaning: "በዕውቀት የታነጸ ሰው ህይወቱንና አካባቢውን ብሩህ ያደርጋል።", userName: "አድሚን", timestamp: 4 },
            { id: "s5", type: "አባባል", text: "ጊዜ የማንም ወዳጅ አይደለም።", meaning: "ጊዜ በፍጥነት ስለሚሄድ በአግባቡ መጠቀም ያስፈልጋል።", userName: "አድሚን", timestamp: 5 },
            { id: "s6", type: "አባባል", text: "ትዕግስት መራራ ናት ፍሬዋ ግን ጣፋጭ ነው።", meaning: "በትዕግስት የሚጠበቅ ውጤት አመርቂ እና አስደሳች ይሆናል።", userName: "አድሚን", timestamp: 6 },
            { id: "s7", type: "ፈሊጣዊ አነጋገር", text: "ሆድና ጀርባ ሆኑ።", meaning: "በጣም ተጣሉ፣ አልተስማሙም ወይም ተለያዩ ማለት ነው።", userName: "አድሚን", timestamp: 7 },
            { id: "s8", type: "ፈሊጣዊ አነጋገር", text: "እጁ ረጅም ነው።", meaning: "ሌባ ነው ወይም የሰውን ነገር ይወስዳል ማለት ነው።", userName: "አድሚን", timestamp: 8 },
            { id: "s9", type: "ፈሊጣዊ አነጋገር", text: "ውኃ ጠጣ።", meaning: "አይነሳም፣ ተሸነፈ ወይም ጉዳዩ ተዘጋ ማለት ነው።", userName: "አድሚን", timestamp: 9 },
            { id: "s10", type: "ቀልድ", text: "መምህሩ፡ 'ፈተና ላይ የማያልፍ ተማሪ ምን ይባላል?' ... ተማሪው፡ 'እንደኔ ያለ ጀግና!' 😂", meaning: "የተማሪዎች አስቂኝ መልስ", userName: "አድሚን", timestamp: 10 },
            { id: "s11", type: "ቀልድ", text: "አንድ ሰውየ ስልኩ ጠፍቶበት 'ኧረ ስልኬን ደውሉልኝ' ቢል፣ ወዳጁ 'ደውዬልህ ነበረ እኮ አይነሳም!' አለው። 🤣", meaning: "የሞኝነት ቀልድ", userName: "አድሚን", timestamp: 11 },
            { id: "s12", type: "ቀልድ", text: "ዶክተሩ፡ 'በቀን 3 ሊትር ውኃ መጠጣት አለብህ' ሲለው፣ ታካሚው፡ 'ኧረ ዶክተር እኔ ቦይለር አይደለሁም!' አለ። 😆", meaning: "የህክምና ቀልድ", userName: "አድሚን", timestamp: 12 }
        ];

        let allItems = [];
        let currentFilter = "ሁሉም";
        let currentSort = "time";

        const dbRef = ref(db, 'amharic_proverbs');
        onValue(dbRef, (snapshot) => {
            const data = snapshot.val();
            allItems = [...sampleData];

            let uniqueUsers = new Set();
            let myContributionsCount = 0;
            sampleData.forEach(item => uniqueUsers.add(item.userName));

            if (data) {
                Object.keys(data).forEach(key => {
                    let item = data[key];
                    item.id = key;
                    item.timestamp = item.timestamp || Date.now();
                    
                    if (item.approved !== false) {
                        allItems.push(item);
                        if (item.userId) {
                            uniqueUsers.add(item.userId);
                            if (String(item.userId) === String(currentUser.id)) {
                                myContributionsCount++;
                            }
                        }
                    }
                });
            }

            document.getElementById('userCount').innerText = uniqueUsers.size;
            document.getElementById('myContributionCount').innerText = myContributionsCount;

            updateCategoryCounts();
            filterItems();
        });

        function updateCategoryCounts() {
            const counts = {
                'ሁሉም': allItems.length,
                'ምሳሌያዊ አነጋገር': 0,
                'አባባል': 0,
                'ፈሊጣዊ አነጋገር': 0,
                'ቀልድ': 0
            };

            allItems.forEach(item => {
                if (counts[item.type] !== undefined) {
                    counts[item.type]++;
                }
            });

            document.getElementById('count-all').innerText = counts['ሁሉም'];
            document.getElementById('count-proverb').innerText = counts['ምሳሌያዊ አነጋገር'];
            document.getElementById('count-saying').innerText = counts['አባባል'];
            document.getElementById('count-idiom').innerText = counts['ፈሊጣዊ አነጋገር'];
            document.getElementById('count-joke').innerText = counts['ቀልድ'];
        }

        window.filterItems = function() {
            const searchInput = document.getElementById('searchInput');
            const searchTerm = searchInput.value.toLowerCase().trim();
            const suggestionsBox = document.getElementById('suggestionsBox');

            if (searchTerm.length > 0) {
                const matches = allItems.filter(item => item.text.toLowerCase().includes(searchTerm)).slice(0, 5);
                if (matches.length > 0) {
                    suggestionsBox.innerHTML = matches.map(m => `<div class="suggestion-item" onclick="selectSuggestion('${m.text.replace(/'/g, "\\'")}')">${m.text}</div>`).join('');
                    suggestionsBox.style.display = 'block';
                } else {
                    suggestionsBox.style.display = 'none';
                }
            } else {
                suggestionsBox.style.display = 'none';
            }

            let filtered = allItems.filter(item => {
                const matchesType = (currentFilter === "ሁሉም" || item.type === currentFilter);
                const matchesText = item.text.toLowerCase().includes(searchTerm) || (item.meaning && item.meaning.toLowerCase().includes(searchTerm));
                return matchesType && matchesText;
            });

            currentSort = document.getElementById('sortSelect').value;
            filtered.sort((a, b) => {
                if (currentSort === "name") {
                    return a.text.localeCompare(b.text, 'am');
                } else if (currentSort === "size") {
                    return b.text.length - a.text.length;
                } else if (currentSort === "type") {
                    return a.type.localeCompare(b.type, 'am');
                } else {
                    return (b.timestamp || 0) - (a.timestamp || 0);
                }
            });

            displayItems(filtered);
        };

        window.selectSuggestion = function(text) {
            document.getElementById('searchInput').value = text;
            document.getElementById('suggestionsBox').style.display = 'none';
            filterItems();
        };

        window.filterByType = function(type, element) {
            currentFilter = type;
            document.querySelectorAll('.tab').forEach(tab => {
                tab.classList.remove('active');
            });
            if (element) {
                element.classList.add('active');
            }
            filterItems();
        };

        // 2. ለአድሚኑ የመሰረዝ (Delete) እና የማሻሻል/ስም የመቀየር (Rename) ፈቃድ
        window.deleteItem = function(id) {
            if (!id || String(id).startsWith('s')) {
                alert("ይህ የናሙና መረጃ ስለሆነ መሰረዝ አይቻልም!");
                return;
            }
            if (confirm("ይህንን አባባል/ቀልድ በእርግጠኝነት መሰረዝ (Delete) ይፈልጋሉ?")) {
                remove(ref(db, 'amharic_proverbs/' + id))
                .then(() => {
                    alert("መረጃው በተሳካ ሁኔታ ተሰርዟል!");
                })
                .catch(err => {
                    alert("ስህተት ተፈጥሯል: " + err.message);
                });
            }
        };

        window.renameItem = function(id, encodedText, encodedMeaning) {
            if (!id || String(id).startsWith('s')) {
                alert("ይህ የናሙና መረጃ ስለሆነ ማሻሻል አይቻልም!");
                return;
            }
            const currentText = decodeURIComponent(encodedText);
            const currentMeaning = decodeURIComponent(encodedMeaning);

            const newText = prompt("አባባሉን / ቀልዱን ያሻሽሉ (Rename/Edit):", currentText);
            if (newText === null || newText.trim() === "") return;

            const newMeaning = prompt("ማብራሪያውን ያሻሽሉ:", currentMeaning);
            if (newMeaning === null) return;

            update(ref(db, 'amharic_proverbs/' + id), {
                text: newText.trim(),
                meaning: newMeaning.trim()
            })
            .then(() => {
                alert("መረጃው በተሳካ ሁኔታ ተሻሽሏል!");
            })
            .catch(err => {
                alert("ስህተት ተፈጥሯል: " + err.message);
            });
        };

        function displayItems(data) {
            const container = document.getElementById('itemsContainer');
            container.innerHTML = '';

            if (data.length === 0) {
                container.innerHTML = '<div class="list-item" style="text-align: center; color: var(--sub-text);">ምንም መረጃ አልተገኘም</div>';
                return;
            }

            const isAdmin = String(currentUser.id) === String(ADMIN_CHAT_ID);

            data.forEach((item) => {
                const div = document.createElement('div');
                div.className = 'list-item';

                // አድሚን ከሆነ የማሻሻል እና የመሰረዝ አዝራር ይታያል
                let adminActionButtons = '';
                if (isAdmin && !String(item.id).startsWith('s')) {
                    adminActionButtons = `
                        <button class="action-btn" style="color: #e67e22; border-color: #e67e22;" onclick="renameItem('${item.id}', '${encodeURIComponent(item.text).replace(/'/g, "\\'")}', '${encodeURIComponent(item.meaning || '').replace(/'/g, "\\'")}')">✏️ Rename</button>
                        <button class="action-btn" style="color: #e74c3c; border-color: #e74c3c;" onclick="deleteItem('${item.id}')">🗑️ Delete</button>
                    `;
                }

                div.innerHTML = `
                    <span class="type">${item.type}</span>
                    <div class="proverb-box">
                        <span class="label-title">📌 ${item.type}:-</span>
                        <span class="text">${item.text}</span>
                    </div>
                    ${item.meaning ? `
                    <div class="meaning-box">
                        <span class="label-title">💡 ማብራሪያ:-</span>
                        <div>${item.meaning}</div>
                    </div>` : ''}
                    <div class="meta-info">
                        <span>በ 👤 <b>${item.userName || 'ስም የሌለው'}</b> ተጨመረ</span>
                        <div style="display:flex; gap: 5px; flex-wrap: wrap;">
                          <button class="action-btn" onclick="downloadSinglePicture('${encodeURIComponent(item.text).replace(/'/g, "\\'")}', '${encodeURIComponent(item.meaning || '').replace(/'/g, "\\'")}')">📥 Save to Gallery</button>
                          <button class="action-btn" onclick="speakText('${encodeURIComponent(item.text + (item.meaning ? '. ማብራሪያው: ' + item.meaning : '')).replace(/'/g, "\\'")}')">🔊 ድምፅ</button>
                          ${adminActionButtons}
                        </div>
                    </div>
                `;
                container.appendChild(div);
            });
        }

        window.speakText = function(encodedText) {
            const text = decodeURIComponent(encodedText);
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(text);
                const voices = window.speechSynthesis.getVoices();
                const amharicVoice = voices.find(v => v.lang.includes('am') || v.lang.includes('am-ET'));
                if (amharicVoice) utterance.voice = amharicVoice;
                utterance.lang = amharicVoice ? amharicVoice.lang : 'am-ET';
                utterance.rate = 0.85;
                window.speechSynthesis.speak(utterance);
            } else {
                alert("የድምፅ ባህሪ በዚህ ብራውዘር ላይ አልተደገፈም።");
            }
        };

        window.downloadSinglePicture = function(encodedText, encodedMeaning) {
            const text = decodeURIComponent(encodedText);
            const meaning = decodeURIComponent(encodedMeaning);

            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            canvas.width = 800;
            canvas.height = 500;

            const gradient = ctx.createLinearGradient(0, 0, 800, 500);
            gradient.addColorStop(0, '#1e3c72');
            gradient.addColorStop(1, '#2a5298');
            ctx.fillStyle = gradient;
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = 'rgba(255, 255, 255, 0.95)';
            if (ctx.roundRect) ctx.roundRect(40, 40, 720, 420, 15);
            else ctx.rect(40, 40, 720, 420);
            ctx.fill();

            ctx.fillStyle = '#2a5298';
            ctx.font = 'bold 26px sans-serif';
            ctx.fillText('🇪🇹 የአማርኛ አባባሎች እና ቀልዶች', 70, 90);

            ctx.fillStyle = '#111111';
            ctx.font = 'bold 22px sans-serif';
            ctx.fillText('ጽሑፍ:-', 70, 150);

            ctx.fillStyle = '#333333';
            ctx.font = 'bold 20px sans-serif';
            wrapText(ctx, text, 70, 185, 650, 30);

            if (meaning) {
                ctx.fillStyle = '#d9534f';
                ctx.font = 'bold 20px sans-serif';
                ctx.fillText('ማብራሪያ:-', 70, 290);

                ctx.fillStyle = '#444444';
                ctx.font = '18px sans-serif';
                wrapText(ctx, meaning, 70, 325, 650, 26);
            }

            const dataUrl = canvas.toDataURL('image/png');
            const modal = document.getElementById('imageModal');
            const modalImg = document.getElementById('previewImg');
            const downloadBtn = document.getElementById('modalDownloadBtn');
            
            modalImg.src = dataUrl;
            downloadBtn.href = dataUrl;
            downloadBtn.download = `Amharic_Proverb_${Date.now()}.png`;
            modal.style.display = 'flex';
        };

        window.closeModal = function() {
            document.getElementById('imageModal').style.display = 'none';
        };

        function wrapText(context, text, x, y, maxWidth, lineHeight) {
            const words = text.split(' ');
            let line = '';
            for (let n = 0; n < words.length; n++) {
                let testLine = line + words[n] + ' ';
                let metrics = context.measureText(testLine);
                if (metrics.width > maxWidth && n > 0) {
                    context.fillText(line, x, y);
                    line = words[n] + ' ';
                    y += lineHeight;
                } else {
                    line = testLine;
                }
            }
            context.fillText(line, x, y);
        }

        window.askAI = function() {
            const question = document.getElementById('aiQuestion').value.trim();
            const aiOutput = document.getElementById('aiOutput');

            if (!question) {
                alert("እባክዎ ጥያቄዎን ይጻፉ!");
                return;
            }

            aiOutput.style.display = "block";
            aiOutput.innerHTML = "🤖 AI እየፈለገ ነው... ትንሽ ይቆዩ...";

            setTimeout(() => {
                const qLower = question.toLowerCase();
                let foundItem = allItems.find(item => 
                    item.text.toLowerCase().includes(qLower) || 
                    (item.meaning && item.meaning.toLowerCase().includes(qLower))
                );

                let answer = foundItem ? `<b>${foundItem.text}</b><br>${foundItem.meaning ? '💡 <b>ማብራሪያ፡</b> ' + foundItem.meaning : ''}` : `ስለ "<b>${question}</b>" መረጃ አልተገኘም።`;
                aiOutput.innerHTML = answer;
            }, 600);
        };

        // 3. መረጃ ሲጫን ለአድሚን ማሳወቅ + ለተጠቃሚው በቴሌግራም ስሙና አይዲው መልዕክት መላክ (ቻናሉን @alemubb12 እንዲቀላቀሉ)
        window.addNewItem = function() {
            const type = document.getElementById('newType').value;
            const text = document.getElementById('newText').value.trim();
            const meaning = document.getElementById('newMeaning').value.trim();

            if (text.length < 5) {
                alert("እባክዎ ትክክለኛ እና ሙሉ አባባል/ቀልድ ያስገቡ!");
                return;
            }

            const newItemRef = push(ref(db, 'amharic_proverbs'));
            const newItemKey = newItemRef.key;
            const newItemData = {
                type: type,
                text: text,
                meaning: meaning,
                userName: currentUser.name,
                userId: currentUser.id,
                timestamp: Date.now(),
                approved: true
            };

            set(newItemRef, newItemData)
            .then(() => {
                document.getElementById('newText').value = "";
                document.getElementById('newMeaning').value = "";
                alert("መረጃው በስኬት ወደ ዌብሳይቱ ተጭኗል! እናመሰግናለን።");

                if (tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');

                // ለአድሚኑ የሚደርሰው ማስታወቂያ (ከእነ መለያ ID)
                const adminMessage = `✨ <b>አዲስ መረጃ በራስ-ሰር ተጭኗል!</b>\n\n` +
                                     `🔑 <b>Database ID:</b> <code>${newItemKey}</code>\n` +
                                     `📌 <b>ዓይነት:</b> ${type}\n` +
                                     `📝 <b>ጽሑፍ:</b> ${text}\n` +
                                     `💡 <b>ማብራሪያ:</b> ${meaning || 'የለውም'}\n\n` +
                                     `👤 <b>ላኪ:</b> ${currentUser.name} (ID: <code>${currentUser.id}</code>)\n\n` +
                                     `⚠️ አስነዋሪ/አስጸያፊ ከሆነ ለመሰረዝ አፑን ከፍተው Delete የሚለውን ይጫኑ ወይም በኮድ በቀላሉ ማጥፋት ይችላሉ።`;

                // Netlify Serverless Function በመጠቀም በሚስጥር መላክ
                fetch('/.netlify/functions/sendTelegram', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: ADMIN_CHAT_ID,
                        text: adminMessage
                    })
                }).catch(err => console.log("Admin notification error:", err));

                // ለተጠቃሚው በቴሌግራም ስማቸውና ID አማካኝነት የሚደርስ መልዕክት (የቴሌግራም ቻናል @alemubb12 ን እንዲቀላቀሉ)
                if (currentUser.id && !String(currentUser.id).startsWith('web_user_') && currentUser.id !== 'unknown') {
                    const userMessage = `ሰላም <b>${currentUser.name}</b> (ID: <code>${currentUser.id}</code>) 👋\n\n` +
                                        `ያስገቡት አባባል/ቀልድ በስኬት ተቀብለናል፤ ስለተሳትፎዎ እጅግ እናመሰግናለን!\n\n` +
                                        `📌 ተጨማሪ አዳዲስ አባባሎችን፣ ቀልዶችን እና ጠቃሚ መረጃዎችን ለማግኘት የቴሌግራም ቻናላችንን ይቀላቀሉ፡\n👉 @alemubb12`;

                    fetch('/.netlify/functions/sendTelegram', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            chat_id: currentUser.id,
                            text: userMessage
                        })
                    }).catch(err => console.log("User message notification error:", err));
                }
            })
            .catch(error => {
                alert("ስህተት ተፈጥሯል: " + error.message);
            });
        };
    </script>
